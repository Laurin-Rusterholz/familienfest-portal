<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Familien-Brunch — Einladung</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f2;--surface:#fff;--surface2:#f4f4f5;--border:#e6e4df;--text:#1f1d1a;--muted:#7a756c;
    --accent:#b5713f;--accent-d:#9a5c30;--accent-l:rgba(181,113,63,.09);--accent-b:rgba(181,113,63,.28);
    --green:#2f8f52;--green-bg:rgba(47,143,82,.09);--green-b:rgba(47,143,82,.35);
    --red:#c0503f;--red-bg:rgba(192,80,63,.08);--red-b:rgba(192,80,63,.32);
    --r:12px;--sh:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.04)
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
  .header{background:linear-gradient(160deg,var(--accent),var(--accent-d));color:#fff;padding:40px 24px 44px;text-align:center}
  .header .tag{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;opacity:.85;margin-bottom:10px}
  .header h1{font-size:27px;font-weight:700;letter-spacing:-.3px}
  .header .fam{font-size:14px;opacity:.9;margin-top:6px;font-weight:500}
  .c{max-width:520px;margin:-28px auto 48px;padding:0 16px;position:relative;z-index:1}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--sh);margin-bottom:16px}
  .greet{font-size:20px;font-weight:700;letter-spacing:-.2px;margin-bottom:6px}
  .greet-sub{font-size:14px;color:var(--muted)}
  .event{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .event .row{display:flex;align-items:flex-start;gap:12px;font-size:15px}
  .event .row .ic{width:22px;text-align:center;flex-shrink:0;font-size:16px}
  .event .row .k{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .event .row .v{font-weight:600}
  .intro{font-size:14px;color:var(--muted);margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
  h2{font-size:16px;font-weight:700;margin-bottom:4px}
  .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
  .rsvp-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice{padding:16px 12px;border:2px solid var(--border);border-radius:var(--r);background:var(--surface2);cursor:pointer;text-align:center;font-weight:700;font-size:15px;transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
  .choice .ce{display:block;font-size:22px;margin-bottom:4px}
  .choice:hover{border-color:var(--muted)}
  .choice.on-yes{border-color:var(--green);background:var(--green-bg);color:var(--green)}
  .choice.on-no{border-color:var(--red);background:var(--red-bg);color:var(--red)}
  .details{margin-top:18px;display:none}
  .details.show{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .count-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .stepper .lbl{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
  .stepper .ctl{display:flex;align-items:center;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .stepper button{width:42px;height:44px;border:none;background:var(--surface2);font-size:20px;font-weight:600;cursor:pointer;color:var(--text);transition:background .12s;-webkit-tap-highlight-color:transparent}
  .stepper button:hover{background:var(--border)}
  .stepper input{flex:1;text-align:center;border:none;font-size:16px;font-weight:700;font-family:inherit;color:var(--text);background:var(--surface);width:100%;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  label .lbl{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
  textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);background:var(--surface);min-height:70px;resize:vertical;transition:border-color .2s}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
  .btn-full{width:100%;padding:15px;font-size:15px;font-weight:700;border:none;border-radius:var(--r);background:var(--accent);color:#fff;cursor:pointer;margin-top:18px;box-shadow:0 2px 10px rgba(181,113,63,.25);transition:background .15s}
  .btn-full:hover{background:var(--accent-d)}
  .btn-full:disabled{opacity:.55;cursor:not-allowed}
  .status-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);font-size:14px;font-weight:600;margin-bottom:4px}
  .status-banner.yes{background:var(--green-bg);border:1px solid var(--green-b);color:var(--green)}
  .status-banner.no{background:var(--red-bg);border:1px solid var(--red-b);color:var(--red)}
  .status-banner .big{font-size:22px}
  .status-meta{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.7}
  .status-meta strong{color:var(--text)}
  .edit-link{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-top:14px;text-decoration:underline}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .notice{text-align:center;padding:8px 0}
  .notice .em{font-size:40px;margin-bottom:12px}
  .notice h2{font-size:18px;margin-bottom:8px}
  .notice p{font-size:14px;color:var(--muted)}
  .footer{text-align:center;padding:20px 24px 32px;font-size:11px;color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--surface);border:2px solid var(--green);border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.12);z-index:100}
  /* Wunschtermin-Hinweis im Event-Block */
  .sep-h{height:1px;background:var(--border);margin:20px 0 0}
  .fav-hint{margin-top:14px;padding:10px 12px;background:var(--accent-l);border:1px solid var(--accent-b);border-radius:10px;font-size:12.5px;color:var(--accent-d);line-height:1.5}
  .fav-hint strong{color:var(--accent-d)}
  /* Termin-Umfrage (Doodle-Stil) */
  .poll{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .poll-date{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
  .poll-date .pd-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .poll-date .pd-day{font-weight:700;font-size:14px}
  .poll-date .fav-badge{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--accent);padding:2px 7px;border-radius:100px}
  .poll-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .popt{padding:9px 4px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface2);cursor:pointer;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .13s;user-select:none;-webkit-tap-highlight-color:transparent}
  .popt .pe{display:block;font-size:16px;margin-bottom:2px}
  .popt:hover{border-color:var(--muted)}
  .popt.on-passt{border-color:var(--green);background:var(--green-bg);color:var(--green)}
  .popt.on-vielleicht{border-color:var(--amber,#b5893f);background:rgba(181,137,63,.12);color:#9a7433}
  .popt.on-passt-nicht{border-color:var(--red);background:var(--red-bg);color:var(--red)}
  /* Termin-Zusammenfassung in der Status-Ansicht */
  .poll-sum{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .poll-sum .psr{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:7px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border)}
  .poll-sum .psr .pv{font-weight:700}
  .poll-sum .psr .pv.passt{color:var(--green)}.poll-sum .psr .pv.vielleicht{color:#9a7433}.poll-sum .psr .pv.passt-nicht{color:var(--red)}.poll-sum .psr .pv.keine{color:var(--muted);font-weight:400}
</style>
</head>
<body>

<div class="header">
  <div class="tag">Einladung</div>
  <h1 id="hTitle">Familien-Brunch</h1>
  <div class="fam" id="hFam">Maag &amp; Rusterholz</div>
</div>

<div class="c" id="app">
  <div class="card"><div class="notice"><div class="em">⏳</div><p>Einladung wird geladen …</p></div></div>
</div>

<div class="footer" id="footer"></div>

<script>
const API = '/.netlify/functions/rsvp';
const params = new URLSearchParams(location.search);
const slug = params.get('gast');

const root = document.getElementById('app');

let state = { guest: null, event: null, pollDates: [], editing: false };

init();

async function init(){
  if(!slug){ renderNoSlug(); return; }
  try{
    const r = await fetch(API + '?gast=' + encodeURIComponent(slug));
    const data = await r.json();
    if(!r.ok || !data.ok){ renderUnknown(); return; }
    state.guest = data.guest;
    state.event = data.event;
    state.pollDates = data.pollDates || [];
    document.getElementById('hTitle').textContent = data.event.title;
    document.getElementById('hFam').textContent = data.event.family;
    state.editing = state.guest.status === 'offen';
    render();
  }catch(e){
    root.innerHTML = card(notice('⚠️','Verbindungsproblem','Bitte lade die Seite später erneut.'));
  }
}

function render(){
  const g = state.guest, ev = state.event;
  let html = '';

  // Begrüssung + Event
  html += `<div class="card">
    <div class="greet">${esc(g.greeting)}</div>
    <div class="greet-sub">wir freuen uns, euch persönlich einzuladen.</div>
    <div class="event">
      ${eventRow('🥐','Anlass', esc(ev.title))}
      ${eventRow('⭐','Wunschtermin', esc(ev.date))}
      ${eventRow('🕙','Zeit', esc(ev.time))}
      ${eventRow('📍','Ort', esc(ev.place))}
    </div>
    <div class="fav-hint">⭐ <strong>${esc(ev.date)}</strong> ist unser Wunschtermin — der finale Termin wird über die Umfrage bestimmt. Bitte gebt unten an, welche Samstage euch passen.</div>
    <div class="intro">${esc(ev.intro)}</div>
  </div>`;

  // RSVP: Status-Anzeige oder Formular
  if(g.status !== 'offen' && !state.editing){
    html += card(statusView(g));
  }else{
    html += card(rsvpForm(g));
  }

  root.innerHTML = html;
  wireForm();
}

function eventRow(ic,k,v){
  return `<div class="row"><div class="ic">${ic}</div><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`;
}

function statusView(g){
  const yes = g.status === 'zugesagt';
  let meta = '';
  if(yes){
    const ad = g.adults + ' ' + (g.adults===1?'Erwachsener':'Erwachsene');
    const ki = g.kids + ' ' + (g.kids===1?'Kind':'Kinder');
    meta = `<div class="status-meta"><strong>Personen:</strong> ${g.count} (${ad}, ${ki})`;
    if(g.comment) meta += `<br><strong>Bemerkung:</strong> ${esc(g.comment)}`;
    meta += `</div>`;
  }else if(g.comment){
    meta = `<div class="status-meta"><strong>Bemerkung:</strong> ${esc(g.comment)}</div>`;
  }
  return `
    <div class="status-banner ${yes?'yes':'no'}">
      <span class="big">${yes?'✅':'❌'}</span>
      <span>${yes?'Ihr habt zugesagt — wir freuen uns!':'Ihr habt leider abgesagt.'}</span>
    </div>
    ${meta}
    ${pollSummary(g)}
    <button class="edit-link" id="editBtn">Antwort ändern</button>`;
}

function pollSummary(g){
  if(!state.pollDates.length) return '';
  const lbl = { 'passt':'Passt', 'vielleicht':'Vielleicht', 'passt-nicht':'Passt nicht' };
  const sym = { 'passt':'✅', 'vielleicht':'🤔', 'passt-nicht':'❌' };
  const rows = state.pollDates.map(d=>{
    const v = g.dates?.[d.id];
    const cls = v || 'keine';
    const txt = v ? sym[v]+' '+lbl[v] : '— keine Angabe';
    return `<div class="psr"><span>${esc(d.label)}${d.favorite?' ⭐':''}</span><span class="pv ${cls}">${txt}</span></div>`;
  }).join('');
  return `<div class="status-meta" style="margin-top:14px"><strong>Eure Termin-Angaben:</strong></div><div class="poll-sum">${rows}</div>`;
}

function rsvpForm(g){
  const yes = g.status === 'zugesagt';
  const no = g.status === 'abgesagt';
  const adults = g.adults ?? g.defaultAdults ?? 2;
  const kids = g.kids ?? 0;
  return `
    <h2>Eure Rückmeldung</h2>
    <div class="sub">Seid ihr beim Brunch dabei?</div>
    <div class="rsvp-choice">
      <div class="choice ${yes?'on-yes':''}" id="cYes" data-v="zugesagt"><span class="ce">🙌</span>Wir kommen</div>
      <div class="choice ${no?'on-no':''}" id="cNo" data-v="abgesagt"><span class="ce">😔</span>Wir kommen nicht</div>
    </div>
    <div class="details ${yes?'show':''}" id="details">
      <div class="count-grid">
        ${stepper('Erwachsene','adults',adults)}
        ${stepper('Kinder','kids',kids)}
      </div>
    </div>
    <div class="sep-h"></div>
    <h2 style="margin-top:20px">📅 Welche Samstage passen euch?</h2>
    <div class="sub">Bitte für jeden Termin angeben (Doodle-Stil).</div>
    <div class="poll">
      ${state.pollDates.map(d => pollDateRow(d, g.dates?.[d.id])).join('')}
    </div>
    <div style="margin-top:18px">
      <label><span class="lbl">Bemerkung (optional)</span>
      <textarea id="comment" placeholder="z.B. Allergien, Ankunftszeit, Grüsse …">${esc(g.comment||'')}</textarea></label>
    </div>
    <button class="btn-full" id="saveBtn" disabled>Antwort speichern</button>`;
}

function pollDateRow(d, cur){
  const opt = (val,em,lbl) =>
    `<div class="popt ${cur===val?'on-'+val:''}" data-date="${d.id}" data-val="${val}"><span class="pe">${em}</span>${lbl}</div>`;
  return `<div class="poll-date">
    <div class="pd-head">
      <span class="pd-day">${esc(d.label)}</span>
      ${d.favorite?'<span class="fav-badge">⭐ Wunschtermin</span>':''}
    </div>
    <div class="poll-opts">
      ${opt('passt','✅','Passt')}
      ${opt('vielleicht','🤔','Vielleicht')}
      ${opt('passt-nicht','❌','Passt nicht')}
    </div>
  </div>`;
}

function stepper(label,name,val){
  return `<div class="stepper"><span class="lbl">${label}</span>
    <div class="ctl">
      <button type="button" data-step="${name}" data-d="-1">−</button>
      <input type="number" id="${name}" value="${val}" min="0" max="20" inputmode="numeric">
      <button type="button" data-step="${name}" data-d="1">+</button>
    </div></div>`;
}

function wireForm(){
  const editBtn = document.getElementById('editBtn');
  if(editBtn) editBtn.onclick = () => { state.editing = true; render(); };

  const cYes = document.getElementById('cYes'), cNo = document.getElementById('cNo');
  const details = document.getElementById('details');
  const saveBtn = document.getElementById('saveBtn');
  if(!cYes) return;

  let choice = state.guest.status !== 'offen' ? state.guest.status : null;

  function refresh(){
    cYes.classList.toggle('on-yes', choice==='zugesagt');
    cNo.classList.toggle('on-no', choice==='abgesagt');
    details.classList.toggle('show', choice==='zugesagt');
    saveBtn.disabled = !choice;
  }
  cYes.onclick = () => { choice='zugesagt'; refresh(); };
  cNo.onclick = () => { choice='abgesagt'; refresh(); };
  refresh();

  document.querySelectorAll('[data-step]').forEach(b=>{
    b.onclick = () => {
      const inp = document.getElementById(b.dataset.step);
      let v = (parseInt(inp.value,10)||0) + parseInt(b.dataset.d,10);
      inp.value = Math.max(0, Math.min(20, v));
    };
  });

  // Termin-Umfrage: pro Datum genau einen Zustand wählen
  const pollChoices = { ...(state.guest.dates || {}) };
  document.querySelectorAll('.popt').forEach(el=>{
    el.onclick = () => {
      const date = el.dataset.date, val = el.dataset.val;
      pollChoices[date] = val;
      document.querySelectorAll(`.popt[data-date="${date}"]`).forEach(sib=>{
        ['on-passt','on-vielleicht','on-passt-nicht'].forEach(c=>sib.classList.remove(c));
      });
      el.classList.add('on-'+val);
    };
  });

  saveBtn.onclick = async () => {
    if(!choice) return;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner"></span>Speichern …';
    const payload = {
      slug: state.guest.slug,
      status: choice,
      adults: parseInt(document.getElementById('adults')?.value,10) || 0,
      kids: parseInt(document.getElementById('kids')?.value,10) || 0,
      comment: document.getElementById('comment')?.value || '',
      dates: pollChoices,
    };
    try{
      const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      const data = await r.json();
      if(!r.ok || !data.ok) throw new Error(data.error||'Fehler');
      state.guest = { ...state.guest, ...data.rsvp };
      state.editing = false;
      render();
      toast(choice==='zugesagt' ? '✅ Zusage gespeichert!' : '❌ Absage gespeichert');
    }catch(e){
      saveBtn.disabled = false;
      saveBtn.textContent = 'Antwort speichern';
      toast('⚠️ ' + e.message);
    }
  };
}

function renderNoSlug(){
  document.getElementById('hFam').textContent = 'Maag & Rusterholz';
  root.innerHTML = card(notice('✉️','Persönlicher Einladungslink',
    'Diese Einladung öffnet sich über deinen persönlichen Link. Bitte nutze den Link aus deiner Einladung.'));
}
function renderUnknown(){
  root.innerHTML = card(notice('🤔','Einladung nicht gefunden',
    'Dieser Einladungslink ist ungültig. Bitte prüfe den Link oder melde dich bei Laurin.'));
}

// Helpers
function card(inner){ return `<div class="card">${inner}</div>`; }
function notice(em,h,p){ return `<div class="notice"><div class="em">${em}</div><h2>${h}</h2><p>${esc(p)}</p></div>`; }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function toast(m){
  const d=document.createElement('div'); d.className='toast'; d.textContent=m;
  document.body.appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity='0'; setTimeout(()=>d.remove(),300); },2800);
}
</script>
</body>
</html>
